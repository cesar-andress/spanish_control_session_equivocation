[project]
name = "scse"
version = "0.0.0"
description = "Spanish control-session equivocation study pipeline (scaffold; no data yet)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "César Andrés", email = "cesar.andres@unir.net" },
  { name = "Jose Jaime Baena Rojas", email = "josejaime.baena@unir.net" },
  { name = "Daniel Pinto Pajares", email = "daniel.pinto@unir.net" },
]
dependencies = [
  "lxml>=5.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pyarrow>=25.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
package = true
